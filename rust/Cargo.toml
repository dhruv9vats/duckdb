[workspace]
resolver = "3"
members = [
    "crates/telemetry/analyzer",
    "crates/telemetry/bridge",
    "crates/telemetry/model",
    "crates/telemetry/server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
# cxx and cxx-build are version-coupled. Keeping the same requirement lets the
# workspace lockfile resolve them together.
cxx = "1"
cxx-build = "1"

