[package]
name = "duckdb-telemetry-model"
version.workspace = true
edition.workspace = true

[features]
collector = ["quent-model/collector"]

[dependencies]
quent-model = { git = "https://github.com/rapidsai/quent.git", rev = "a872bf1a113c6509ccb4347fc98b067bd6c1829f" }
quent-query-engine-model = { git = "https://github.com/rapidsai/quent.git", rev = "a872bf1a113c6509ccb4347fc98b067bd6c1829f" }
uuid = "1"

[build-dependencies]
# Records this repository as the model source in the generated model.qmi.
quent-build-info = { git = "https://github.com/rapidsai/quent.git", rev = "a872bf1a113c6509ccb4347fc98b067bd6c1829f" }

[dev-dependencies]
clap = { version = "4", features = ["derive", "env"] }
quent-io = { git = "https://github.com/rapidsai/quent.git", rev = "a872bf1a113c6509ccb4347fc98b067bd6c1829f", features = ["clap"] }
uuid = { version = "1", features = ["macro-diagnostics"] }
